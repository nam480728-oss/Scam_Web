{% extends "base.html" %}
{% block title %}Tin nhắn · DangNam{% endblock %}
{% block content %}
<main class="chat-page">
  <div class="chat-layout" id="chat-layout" data-initial-cid="{{ initial_cid or '' }}">

    <!-- ===== Cột trái ===== -->
    <section class="panel side-panel" aria-label="Danh sách">
      <div class="side-head">
        <div class="side-title"><h2>Đoạn chat</h2><button class="btn btn-sm ask-guard" id="ask-paste-btn" type="button" title="Dán một đoạn tin nhắn để Vệ sĩ kiểm tra">🛡️ Hỏi Vệ sĩ</button></div>
        <div class="searchbox"><input id="search" type="search" placeholder="Tìm người dùng để kết bạn hoặc nhắn tin" autocomplete="off" aria-label="Tìm kiếm người dùng"></div>
      </div>
      <div class="tabs" id="tabs" role="tablist">
        <button class="tab active" data-tab="chats" role="tab">Đoạn chat</button>
        <button class="tab" data-tab="pending" role="tab" title="Tin nhắn từ người lạ">Tin nhắn chờ<span class="badge hidden" id="tab-pending-badge">0</span></button>
        <button class="tab" data-tab="friends" role="tab">Bạn bè</button>
        <button class="tab" data-tab="blocked" role="tab">Đã chặn</button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <!-- ===== Khung chat ===== -->
    <section class="panel chat-panel" id="chat-panel" aria-label="Cuộc trò chuyện">
      <div class="chat-empty" id="chat-empty">
        <div><span class="big">💬</span><h3>Chọn một đoạn chat</h3><p>Hoặc tìm bạn ở ô tìm kiếm bên trái, kết bạn rồi bắt đầu trò chuyện.</p></div>
      </div>

      <div class="chat-box hidden" id="chat-box">
        <div class="chat-head">
          <button class="icon-btn back-btn" id="back-btn" aria-label="Quay lại">←</button>
          <span id="head-avatar"></span>
          <div class="who"><b id="head-name"></b><small id="head-status"></small></div>
          <button class="icon-btn" id="call-audio-btn" aria-label="Gọi thoại" title="Gọi thoại">📞</button>
          <button class="icon-btn" id="call-video-btn" aria-label="Gọi video" title="Gọi video">🎥</button>
          <button class="icon-btn" id="msearch-btn" aria-label="Tìm trong cuộc trò chuyện" title="Tìm trong cuộc trò chuyện">🔍</button>
          <button class="icon-btn" id="media-btn" aria-label="Ảnh, tệp và link đã gửi" title="Ảnh, tệp và link đã gửi">🗂️</button>
          <button class="icon-btn" id="ask-btn" aria-label="Hỏi Vệ sĩ" title="Hỏi Vệ sĩ về cuộc trò chuyện này">🛡️</button>
          <div class="menu">
            <button class="icon-btn" id="head-menu-btn" aria-label="Tùy chọn" aria-haspopup="true">⋮</button>
            <div class="dropdown hidden" id="head-menu" role="menu"></div>
          </div>
        </div>

        <div class="msearch hidden" id="msearch" role="search">
          <input class="input sm" id="msearch-input" type="search" placeholder="Tìm tin nhắn trong cuộc trò chuyện…" autocomplete="off" aria-label="Tìm tin nhắn">
          <button class="icon-btn" id="msearch-close" type="button" aria-label="Đóng tìm kiếm">✕</button>
          <div class="msearch-results hidden" id="msearch-results"></div>
        </div>
        <div class="pinned-bar hidden" id="pinned-bar"></div>
        <div id="banner-box"></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="typing" id="typing"></div>

        <div class="composer-wrap" id="composer-wrap">
          <div class="blocked-bar hidden" id="blocked-bar"></div>
          <div id="composer-inner">
            <div id="reply-slot"></div>
            <div id="attach-slot"></div>
            <div class="recording hidden" id="recording" role="status">
              <span class="rec-dot"></span><b id="rec-time">0:00</b><span class="muted small" id="rec-hint">Đang ghi âm…</span>
              <button class="btn btn-sm" id="rec-cancel" type="button">Hủy</button>
              <button class="btn btn-sm btn-primary" id="rec-send" type="button">➤ Gửi</button>
            </div>
            <div class="composer" id="composer">
              <button class="icon-btn" id="emoji-btn" type="button" aria-label="Chọn emoji">😊</button>
              <button class="icon-btn" id="attach-btn" type="button" aria-label="Đính kèm ảnh hoặc tệp">📎</button>
              <input type="file" id="file-input" class="hidden" accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar,.7z,.apk">
              <textarea id="input" rows="1" placeholder="Nhập tin nhắn…" maxlength="2000" aria-label="Nội dung tin nhắn"></textarea>
              <button class="icon-btn" id="mic-btn" type="button" aria-label="Ghi âm tin nhắn thoại" title="Ghi âm tin nhắn thoại">🎤</button>
              <button class="icon-btn send-btn" id="send-btn" type="button" aria-label="Gửi" disabled>➤</button>
            </div>
          </div>
          <div class="emoji-pop hidden" id="emoji-pop"></div>
        </div>
      </div>

      <aside class="media-drawer hidden" id="media-drawer" aria-label="Ảnh, tệp và link">
        <div class="md-head"><b>Ảnh, tệp và link</b><button class="icon-btn" id="media-close" type="button" aria-label="Đóng">✕</button></div>
        <div class="tabs" id="media-tabs" role="tablist">
          <button class="tab active" data-kind="images" role="tab">Ảnh</button>
          <button class="tab" data-kind="files" role="tab">Tệp</button>
          <button class="tab" data-kind="links" role="tab">Link</button>
        </div>
        <div class="md-body" id="media-body"></div>
      </aside>
    </section>
  </div>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/chat.js') }}"></script>{% endblock %}
