<header class="topnav">
  <div class="nav-left">
    <a class="brand" href="{{ url_for('feed.feed_page') }}" aria-label="DangNam - Bảng tin">
      <img class="logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt=""><span class="n">DangNam</span>
    </a>
    <form class="nav-search" action="{{ url_for('social.search_page') }}" method="get" role="search">
      <input type="search" name="q" placeholder="Tìm kiếm trên DangNam" value="{{ request.args.get('q', '') if request.endpoint == 'social.search_page' else '' }}" aria-label="Tìm kiếm người dùng">
    </form>
  </div>
  <nav class="navtabs" aria-label="Điều hướng chính">
    <a class="navtab {{ 'active' if request.endpoint == 'feed.feed_page' }}" href="{{ url_for('feed.feed_page') }}" title="Bảng tin">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><span class="t">Bảng tin</span>
    </a>
    <a class="navtab {{ 'active' if request.endpoint == 'social.friends_page' }}" href="{{ url_for('social.friends_page') }}" title="Bạn bè">
      <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm8 1c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4zm-8 0c-.3 0-.7 0-1.1.1A5 5 0 0 1 9 17v3H0v-2.5C0 15.300 4.300 13 8 13z"/></svg>
      <span class="t">Bạn bè</span><span class="badge hidden" id="nav-requests">0</span>
    </a>
    <a class="navtab {{ 'active' if request.endpoint == 'chat.messages_page' }}" href="{{ url_for('chat.messages_page') }}" title="Tin nhắn">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.500 2 2 6.100 2 11.200c0 2.900 1.400 5.400 3.700 7.100V22l3.400-1.900c.9.2 1.800.4 2.900.4 5.500 0 10-4.100 10-9.300S17.500 2 12 2zm1 12.500-2.600-2.800-5 2.800 5.400-5.800 2.600 2.800 4.900-2.800z"/></svg>
      <span class="t">Tin nhắn</span><span class="badge hidden" id="nav-unread">0</span>
    </a>
    <a class="navtab {{ 'active' if request.endpoint == 'guardian.dashboard' }}" href="{{ url_for('guardian.dashboard') }}" title="Bảng điều khiển Vệ sĩ">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.400 9.700 8 11 4.600-1.300 8-6 8-11V5zm-1.200 14.200-3.500-3.500 1.400-1.400 2.100 2.100 4.900-4.900 1.400 1.400z"/></svg>
      <span class="t">Vệ sĩ</span>
    </a>
    <a class="navtab {{ 'active' if request.endpoint == 'guardian.demo_page' }}" href="{{ url_for('guardian.demo_page') }}" title="Trình diễn">
      <svg viewBox="0 0 24 24"><path d="M3 4h18v12H3zm2 2v8h14V6zm3 12h8v2H8z"/></svg><span class="t">Demo</span>
    </a>
  </nav>
  <div class="nav-right">
    <span class="model-chip" id="model-chip" title="Mô hình AI 3 (Đọc vị) đang hoạt động">🤖 <span id="model-name">{{ ai_name() }}</span></span>
    <div class="menu">
      <button class="round-btn" id="notif-btn" aria-haspopup="true" aria-label="Thông báo">🔔<span class="badge hidden" id="nav-notif">0</span></button>
      <div class="dropdown notif-pop hidden" id="notif-pop" role="menu">
        <div class="who">Thông báo <button class="linkbtn" id="notif-read-all" type="button">Đánh dấu đã đọc</button></div>
        <div id="notif-list" class="notif-list"><div class="empty">Đang tải…</div></div>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn" id="user-menu-btn" aria-haspopup="true" aria-expanded="false">
        {{ avatar_html(current_user, 'sm') }}<b class="hide-sm">{{ current_user.name }}</b>
      </button>
      <div class="dropdown hidden" id="user-menu" role="menu">
        <a class="who" href="{{ url_for('social.profile_page', username=current_user.username) }}">{{ avatar_html(current_user, 'sm') }} {{ current_user.name }}</a>
        <a href="{{ url_for('social.profile_page', username=current_user.username) }}">👤 Trang cá nhân</a>
        <a href="{{ url_for('settings.settings_page') }}">⚙️ Cài đặt & Vệ sĩ</a>
        <button type="button" id="theme-toggle">🌓 Đổi giao diện sáng / tối</button>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">🚪 Đăng xuất</button>
        </form>
      </div>
    </div>
  </div>
</header>
